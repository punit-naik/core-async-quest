version: 2.1

orbs:
  browser-tools: circleci/browser-tools@1.1
jobs:
  build:
    docker:
      - image: cimg/clojure:1.11-openjdk-21.0-browsers

    working_directory: ~/repo

    environment:
      LEIN_ROOT: "true"
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200m

    steps:
      - checkout

      # Chrome is the only browser used by the headless test step.
      - browser-tools/install-chrome

      - run:
          name: Verify headless browser utilities
          command: google-chrome --version

      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "project.clj" }}
            - v2-dependencies-

      - run: lein deps

      - save_cache:
          paths:
            - ~/.m2
          key: v2-dependencies-{{ checksum "project.clj" }}

      - run:
          name: Build ClojureScript tests
          command: lein cljsbuild once test

      - run:
          name: Run tests in headless Chrome
          command: |
            python3 -m http.server 8000 --directory resources/public >/tmp/core-async-quest-http.log 2>&1 &
            google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom http://localhost:8000/test.html | tee /tmp/test-page.html
            grep 'data-test-result="passed"' /tmp/test-page.html
